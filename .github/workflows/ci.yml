name: CI

on:
  push:
  pull_request:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y redis-tools redis-server
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  gatekeeper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gatekeeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gatekeeper/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build

  rag-consensus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag_consensus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m mypy --strict src tests
      - run: python -m pytest -q

  rag-consensus-e2e:
    # Contra el servicio REAL ContextRAG_Engine + PostgreSQL real (instalado en los runners de GitHub)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag_consensus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ./scripts/run_e2e.sh

  ecosystem:
    # Stack unificado "Segundo Cerebro": validación estática (el E2E con contenedores se lanza con ecosystem/scripts/run_e2e_stack.sh)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecosystem
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example --profile e2e config --quiet
      - run: bash -n scripts/run_e2e_stack.sh scripts/gen_secrets.sh postgres/init/10-databases.sh && sh -n redis/entrypoint.sh
      - run: python -m py_compile e2e/e2e_stack.py init/bootstrap.py
